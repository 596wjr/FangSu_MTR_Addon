modLoader = "javafml"
loaderVersion = "${forge_loader_dependency}"
issueTrackerURL = "https://github.com/596wjr/FangSu_MTR_Addon/issues"
license = "MIT"

[[mods]]
modId = "fangsu"
version = "${version}"
displayName = "FangSu MTR Addon"
authors = "596wjr"
description = '''
Added blocks such as OBJ-format ticket gates, and provided a set of interfaces to simplify the creation of MTR extensions.
'''
logoFile = "icon.png"

[[dependencies.fangsu]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.fangsu]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.fangsu]]
modId = "architectury"
mandatory = true
versionRange = "${architectury_dependency}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.fangsu]]
modId = "mtr"
mandatory = true
versionRange = "[,4.0.0)"
side = "BOTH"
ordering = "AFTER"

